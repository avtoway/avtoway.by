services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # SQLite в контейнере; файл лежит на volume, поэтому данные сохраняются.
      DATABASE_URL: "file:/app/data/avtoway.db"
      AUTH_SECRET: "${AUTH_SECRET:?Задайте AUTH_SECRET в .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Задайте ENCRYPTION_KEY в .env}"
      NODE_ENV: production
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      - ./backups:/app/backups
    restart: unless-stopped
